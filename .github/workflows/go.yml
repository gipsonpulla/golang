
# This workflow builds and tests a Go project.
# For more information, see:
# https://docs.github.com/en/actions/automating-builds-and-tests/building-and-testing-go


name: Go

on:
  push:
    branches: ["main"]
  pull_request:
    branches: ["main"]

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Check out code
        uses: actions/checkout@v4

      - name: Set up Go
        uses: actions/setup-go@v5
        with:
          #go-version: "1.20"
          go-version-file: go.mod
          cache: false

      - name: Build
        working-directory: ./basics
        run: go build -v .
      
      - name: Run
        working-directory: ./basics
        run: go run .

      - name: Run Go calculator
        working-directory: ./basics/simple_cal
        run: go run main.go 10 5
